shared_rules:
  authentication: Paired X-GT-USER-ID + X-GT-API-KEY headers. Neither works alone.
  tenancy: tenant_id is a required query parameter on 242 of 259 operations.
  idempotency: Not supported. No write in this API is safe to blind-retry.
  rate_limits: None published, no 429 declared, no Retry-After header. Back off on your own schedule.
  errors: Two envelopes coexist - the standard errors[] envelope and FastAPI's detail[] validation
    shape. Handle both. See errors/groundtruth-problem-types.yml.
  tracing: Capture the x-gt-trace-id response header; it is undocumented but present on every response.
  events: None. No webhooks, no AsyncAPI, no streaming. Poll /jobs.
