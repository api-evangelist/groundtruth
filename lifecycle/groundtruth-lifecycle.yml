  legacy_release_notes:
    host: https://api.groundtruth.com/
    title: xAd API Server v1.19.0
    http_status: 200
    checked: '2026-08-12'
    latest_entry: April 12, 2016
    note: >-
      The legacy xAd API Server still answers on api.groundtruth.com and serves an HTML page of
      dated release notes, but the most recent entry is from April 2016 and it links to no reachable
      documentation ("Please read the API documentation and also apply for an access key" — /docs,
      /api, /v1, /swagger.json all 404). It is a decade-stale surface for a predecessor API and is
      deliberately NOT wired as a ChangeLog pointer, because doing so would credit the current API
      with a changelog it does not have.
