versioning:
- api: GroundTruth Ads Manager Public API
  scheme: unversioned-path
  current: '1.0.0'
  evidence: >-
    info.version 1.0.0 in the live OpenAPI. No version segment in any of the 237 paths, and no
    version negotiation header. The API does expose an unauthenticated GET /version operation
    (operationId get_version, schema VersionModel), so the running build is discoverable at runtime
    even though the contract is not versioned in the URL.
- api: Groundtruth Reporting API
  scheme: uri-path
  current: v1
  spec_version: '2.0.0'
  evidence: All 59 paths are /demand/v1/...; info.version is 2.0.0.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecated_operations: []
  evidence: >-
    Zero operations in either OpenAPI carry `deprecated: true`. No deprecation, sunset or
    breaking-change policy page exists on api-docs.groundtruth.com, docs.groundtruth.com or
    www.groundtruth.com. No Deprecation or Sunset (RFC 8594) headers were observed on live
    responses. No `Deprecation` pointer is emitted in apis.yml — there is no policy to point at.
  in_contract_deprecation_note: >-
    One field-level deprecation IS documented: the batch data-partner ingestion doc at
    docs.groundtruth.com/docs/data-partners states "Note: The country field is deprecated. Country
    is derived using the coordinates." That is a CSV field, not an API operation.
