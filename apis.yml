- name: Groundtruth Reporting API
  description: 'Read-only external reporting API (the "demand" API) for pulling GroundTruth
    campaign performance out of the platform and into a partner or agency reporting stack:
    account, organization, campaign, ad group and creative totals and daily series, product-level
    breakdowns, location and secondary-visit location data, audience and behavioral segments,
    web engagement, and CTV/OTT and audio metrics. 59 GET operations described by an OpenAPI
    3.0.1 document, fronted by AWS API Gateway. Authenticated with the same paired X-GT-USER-ID
    and X-GT-API-KEY headers; credentials are requested from GroundTruth support. The provider
    notes that all endpoints currently require HTTP/1.1.'
  humanURL: https://reporting.groundtruth.com/api
  baseURL: https://reporting.groundtruth.com
