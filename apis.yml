- name: GroundTruth Documentation MCP Server
  description: 'Model Context Protocol endpoint served on the GroundTruth developer
    documentation host. It answers MCP JSON-RPC on /mcp but returns error -32001
    "Authorization required" to anonymous initialize and tools/list calls, so the live
    tool list and input schemas could not be read without credentials. Recorded from a
    live probe, not from provider documentation.'
