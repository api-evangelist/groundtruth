apis:
- name: GroundTruth Ads Manager Public API
  description: 'REST API for the GroundTruth Ads Manager platform: create and manage accounts,
    organizations, tenants, users, campaigns, ad groups, creatives and creative assets; run
    audience, location and static reference lookups; submit and poll long-running jobs and
    uploads; and pull reporting across performance, supply/system distribution, day-of-week
    and time-of-day metrics, product insights, audience breakdowns, visitation and CTV/OTT.
    259 operations described by a live OpenAPI 3.1.0 document served by the API itself at
    /openapi.json, with Swagger UI at /docs. Authenticated with paired X-GT-USER-ID and
    X-GT-API-KEY headers; credentials are provided on request.'
