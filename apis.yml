aid: groundtruth
name: GroundTruth
description: 'GroundTruth is a location-intelligence performance advertising platform (formerly xAd)
  that helps brands and agencies plan, launch, and measure omnichannel ad campaigns tied to real-world
  behavior. Its Ads Manager, proprietary Blueprints location-mapping technology, and Dynamic Intent
  Prediction AI turn visitation, behavioral, and demographic signals into targeting and store-visit
  and sales attribution across verticals including QSR/restaurants, CPG, auto, retail, healthcare,
  education, travel, and political. GroundTruth is backed by Emergence Capital and IVP and became part
  of ZeroToOne.AI in 2026. GroundTruth publishes two public REST API surfaces: the Ads Manager Public
  API at api-public.groundtruth.com (259 operations across accounts, organizations, tenants, campaigns,
  ad groups, creatives, audiences, jobs, uploads, search and reporting, with a live OpenAPI 3.1 document
  and Swagger UI at /docs), and the Groundtruth Reporting API at reporting.groundtruth.com (59 read-only
  demand-reporting operations described by an OpenAPI 3.0.1 document). Both authenticate with the paired
  X-GT-USER-ID and X-GT-API-KEY headers; credentials are issued on request rather than self-serve.'
