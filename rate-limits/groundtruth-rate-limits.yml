note: >-
  GroundTruth publishes no rate limits for either API. An honest zero, not an unchecked field.
  Searched: the Ads Manager reference at api-docs.groundtruth.com (270 endpoint pages plus the
  Welcome page, whose entire content is the authentication headers), the Reporting API reference at
  reporting.groundtruth.com/api, the GroundTruth help centre, and both OpenAPI documents. Zero
  matches for "rate limit", "ratelimit", "throttl", "quota", "429" or "Retry-After" in either
  specification. Not one of the 259 Ads Manager operations or 59 Reporting operations declares a 429
  response. Live responses from api-public.groundtruth.com (GET /health 200, GET /accounts 401,
  POST /campaigns 401 on 2026-08-12) carried no X-RateLimit-*, RateLimit-* or Retry-After header —
  only date, content-type, server, x-gt-trace-id, x-frame-options and etag.
