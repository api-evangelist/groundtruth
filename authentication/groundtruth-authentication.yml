summary:
  types:
  - apiKey
  api_key_in:
  - header
  model: >-
    Paired-header API key. Both GroundTruth API surfaces require the SAME two headers together —
    X-GT-USER-ID (the calling user's identifier) and X-GT-API-KEY (the secret). Neither header is
    sufficient on its own. There is no OAuth 2.0, OIDC, mutual TLS or bearer-token flow on either
    surface, and therefore no scope surface (scopes/ is intentionally absent).
  credential_issuance: >-
    Not self-serve. The provider's own reference states "API credentials are provided on a request
    basis", and the help centre directs reporting-API users to contact support to request
    credentials. There is no signup, key-provisioning or key-rotation endpoint in either spec.
