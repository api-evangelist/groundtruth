    AudioStreamingGenresModel:
      properties:
        items:
          items:
            $ref: '#/components/schemas/app__api__routes__static__models__AudioStreamingGenreModel'
          type: array
          title: Items
      type: object
      required:
      - items
      title: AudioStreamingGenresModel
    app__api__routes__static__models__CTVPremiumCategoryModel:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        apps:
          items:
            $ref: '#/components/schemas/CTVAppModel'
          type: array
          title: Apps
      type: object
      required:
      - id
      - name
      - apps
      title: CTVPremiumCategoryModel
    CTVAppModel:
      properties:
        name:
          type: string
          title: Name
        logo_url:
          type: string
          title: Logo Url
      type: object
      required:
      - name
      - logo_url
      title: CTVAppModel
    ErrorModel:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        fields:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Fields
      type: object
      required:
      - code
      - message
      - fields
      title: ErrorModel
    app__api__routes__static__models__AudioStreamingGenreModel:
      properties:
