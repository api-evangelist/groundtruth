      - name
      title: AccountVerticalModel
    IABCategoriesResponseModel:
      properties:
        items:
          items:
            $ref: '#/components/schemas/IABCategoryModel'
          type: array
          title: Items
      type: object
      required:
      - items
      title: IABCategoriesResponseModel
    AccountVerticalsModel:
