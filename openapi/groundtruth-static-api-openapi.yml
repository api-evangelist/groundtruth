        name:
          type: string
          title: Name
        icon:
          type: string
          title: Icon
        color:
          type: string
          pattern: ^[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$
          title: Color
          examples:
          - FFAA74
          - 01AB23CD
      type: object
