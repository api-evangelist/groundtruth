components:
  schemas:
    BudgetModel-Input:
      properties:
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
        budget:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Budget
          description: If budget is at the campaign level, this will be 0
      type: object
      required:
      - start_date
      - end_date
      - budget
      title: BudgetModel
    CreateUpdateCTVPremiumCategoryModel:
      properties:
        id:
          type: integer
          title: Id
      type: object
      required:
      - id
      title: CreateUpdateCTVPremiumCategoryModel
    BudgetLevel:
      oneOf:
      - const: campaign
        title: CAMPAIGN
      - const: adgroup
        title: ADGROUP
      type: string
      enum:
      - campaign
      - adgroup
      title: BudgetLevel
      x-enum-varnames:
      - CAMPAIGN
      - ADGROUP
    CreateCampaignAndAdgroupsModel:
      properties:
        campaign:
          $ref: '#/components/schemas/CreateCampaignModel'
        adgroups:
          items:
            $ref: '#/components/schemas/CreateAdgroupModel'
          type: array
          title: Adgroups
      type: object
      required:
      - campaign
      title: CreateCampaignAndAdgroupsModel
    CreateUpdateAudioStreamingGenreModel:
      properties:
        id:
          type: integer
          title: Id
      type: object
      required:
      - id
      title: CreateUpdateAudioStreamingGenreModel
    LookalikeAudienceScale:
      oneOf:
      - const: 1
        title: SCALE_2X
      - const: 3
        title: SCALE_4X
      - const: 5
        title: SCALE_6X
      - const: 9
        title: SCALE_10X
      type: integer
      enum:
      - 1
      - 3
      - 5
      - 9
      title: LookalikeAudienceScale
      x-enum-varnames:
      - SCALE_2X
      - SCALE_4X
      - SCALE_6X
      - SCALE_10X
    CampaignBudgetType:
      oneOf:
      - const: 0
        title: LIFETIME
      - const: 3
        title: DAILY
      type: integer
      enum:
      - 0
      - 3
      title: CampaignBudgetType
      x-enum-varnames:
      - LIFETIME
      - DAILY
    NeighborhoodModel:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        type:
          $ref: '#/components/schemas/NeighborhoodTargetType'
        sensitivity:
          anyOf:
          - $ref: '#/components/schemas/Sensitivity'
          - type: 'null'
        location_group_metadata:
          anyOf:
          - $ref: '#/components/schemas/app__api__models__LocationGroupMetadata'
          - type: 'null'
      type: object
      required:
      - id
      - name
      - type
      title: NeighborhoodModel
    DriveToLocationType:
      oneOf:
      - const: brand
        title: BRAND
      - const: location_group
        title: LOCATION_GROUP
      type: string
      enum:
      - brand
      - location_group
      title: DriveToLocationType
      x-enum-varnames:
      - BRAND
      - LOCATION_GROUP
    BillingSource:
      oneOf:
      - const: 1
        title: XAD
      - const: 2
        title: DART
      - const: 3
        title: AARKI
      - const: 4
        title: BEINTO
      - const: 5
        title: BONZAI
      - const: 6
        title: BRIDGETRACK
      - const: 7
        title: CELTRA
