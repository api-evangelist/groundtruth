      tags:
      - Location Groups
      summary: Upload Location Group Pois File
      description: Uploads a POI file to a location group
      operationId: upload_location_group_pois_file
      security:
      - api-key: []
      - user-id: []
      - session: []
      parameters:
      - name: location_group_id
        in: path
        required: true
        schema:
          type: integer
          title: Location Group Id
      - name: tenant_id
        in: query
        required: true
