          type: integer
          title: Tenant Id
        poi_counts:
          $ref: '#/components/schemas/LocationGroupPOICountModel'
      type: object
      required:
      - id
      - name
      - description
      - account_id
      - brand_count
      - category_count
      - build_audience
      - audience_status
      - neighborhood_status
      - tenant_id
      - poi_counts
      title: LocationGroupModel
    LocationGroupTargetingModel:
      properties:
        audience:
          $ref: '#/components/schemas/TargetingTypeStatusModel'
          description: Audience targeting state
        neighborhood:
