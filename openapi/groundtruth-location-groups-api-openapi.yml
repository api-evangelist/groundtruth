  /location_groups:
    get:
      tags:
      - Location Groups
      summary: Get Location Groups
      description: Get location groups
      operationId: get_location_groups
      security:
      - api-key: []
      - user-id: []
      - session: []
      parameters:
      - name: page_num
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number to retrieve. Starts at 1.
          default: 1
          title: Page Num
        description: Page number to retrieve. Starts at 1.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of location groups per page.
          default: 50
          title: Limit
        description: Number of location groups per page.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 100
