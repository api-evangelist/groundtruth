      tags:
      - Location Groups
      summary: Get Location Group Pois Upload Template
      description: Downloads a location group POI upload template
      operationId: get_location_group_pois_upload_template
      security:
      - api-key: []
      - user-id: []
      - session: []
      parameters:
      - name: poi_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LocationGroupPOIType'
          description: POI type whose upload template to download
          default: standard
        description: POI type whose upload template to download
      - name: file_extension
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LocationGroupPOIUploadTemplateFileExtension'
          description: File extension to download
          default: xlsx
        description: File extension to download
      - name: tenant_id
        in: query
        required: true
        schema:
          type: integer
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
          description: Unauthorized
        '403':
          content:
            application/json:
