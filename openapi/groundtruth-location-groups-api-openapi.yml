          anyOf:
          - type: string
            maxLength: 45
            minLength: 1
          - type: 'null'
          title: City
          description: City
        state:
          anyOf:
          - type: string
            maxLength: 30
            minLength: 2
          - type: 'null'
          title: State
          description: State
