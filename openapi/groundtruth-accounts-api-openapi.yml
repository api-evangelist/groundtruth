          title: Url
        segment_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Segment Id
        updated_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated Date
        website_url:
          type: string
          title: Website Url
        hashcode:
          anyOf:
          - type: string
          - type: 'null'
          title: Hashcode
      type: object
      required:
      - id
      - tenant_id
      - organization_id
      - account_id
      - name
      - url
      - website_url
      title: AccountPixelModel
    CreateAccountPixelModel:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
        enable_site_retargeting:
          type: boolean
          title: Enable Site Retargeting
      type: object
