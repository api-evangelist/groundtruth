components:
  schemas:
    ErrorModel:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        fields:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Fields
      type: object
      required:
      - code
      - message
      - fields
      title: ErrorModel
    CountryCode:
      type: string
      enum:
      - US
      - CA
      title: CountryCode
    ErrorResponseModel:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ErrorModel'
          type: array
          title: Errors
      type: object
      required:
      - errors
      title: ErrorResponseModel
    AccountPixelsModel:
      properties:
        total_count:
          type: integer
          title: Total Count
        limit:
          type: integer
          title: Limit
        page_num:
          type: integer
          title: Page Num
        total_pages:
          type: integer
          title: Total Pages
        has_next_page:
          type: boolean
          title: Has Next Page
        has_prev_page:
          type: boolean
          title: Has Prev Page
        items:
          items:
            $ref: '#/components/schemas/AccountPixelModel'
          type: array
          title: Items
      type: object
      required:
      - total_count
      - limit
      - page_num
      - total_pages
      - has_next_page
      - has_prev_page
      - items
      title: AccountPixelsModel
    SortOrder:
      oneOf:
      - const: desc
        title: DESC
      - const: asc
        title: ASC
      type: string
      enum:
      - desc
      - asc
      title: SortOrder
      x-enum-varnames:
      - DESC
      - ASC
    CreateAccountModel:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        country_code:
          $ref: '#/components/schemas/CountryCode'
        timezone:
          $ref: '#/components/schemas/Timezone'
        currency:
          $ref: '#/components/schemas/Currency'
        website_domain:
          type: string
          maxLength: 512
          title: Website Domain
        vertical_id:
          anyOf:
          - $ref: '#/components/schemas/AccountVertical'
          - type: 'null'
      type: object
      required:
      - name
      - country_code
      - timezone
      - currency
      - website_domain
      title: CreateAccountModel
    Timezone:
      oneOf:
      - const: America/Los_Angeles
        title: AMERICA_LOS_ANGELES
      - const: America/Phoenix
        title: AMERICA_PHOENIX
      - const: America/Chicago
        title: AMERICA_CHICAGO
      - const: America/New_York
        title: AMERICA_NEW_YORK
      - const: Pacific/Honolulu
        title: PACIFIC_HONOLULU
      - const: America/Anchorage
        title: AMERICA_ANCHORAGE
      - const: America/St_Johns
        title: AMERICA_ST_JOHNS
      - const: America/Halifax
        title: AMERICA_HALIFAX
      - const: America/Blanc-Sablon
        title: AMERICA_BLANC_SABLON
      - const: America/Toronto
        title: AMERICA_TORONTO
      - const: America/Atikokan
        title: AMERICA_ATIKOKAN
      - const: America/Winnipeg
        title: AMERICA_WINNIPEG
      - const: America/Resolute
        title: AMERICA_RESOLUTE
      - const: America/Regina
        title: AMERICA_REGINA
      - const: America/Edmonton
        title: AMERICA_EDMONTON
      - const: America/Creston
        title: AMERICA_CRESTON
      - const: America/Vancouver
        title: AMERICA_VANCOUVER
      type: string
      enum:
      - America/Los_Angeles
      - America/Phoenix
      - America/Chicago
      - America/New_York
      - Pacific/Honolulu
      - America/Anchorage
      - America/St_Johns
      - America/Halifax
      - America/Blanc-Sablon
      - America/Toronto
      - America/Atikokan
      - America/Winnipeg
      - America/Resolute
      - America/Regina
      - America/Edmonton
      - America/Creston
      - America/Vancouver
      title: Timezone
      x-enum-varnames:
      - AMERICA_LOS_ANGELES
      - AMERICA_PHOENIX
      - AMERICA_CHICAGO
      - AMERICA_NEW_YORK
      - PACIFIC_HONOLULU
      - AMERICA_ANCHORAGE
      - AMERICA_ST_JOHNS
      - AMERICA_HALIFAX
      - AMERICA_BLANC_SABLON
      - AMERICA_TORONTO
      - AMERICA_ATIKOKAN
      - AMERICA_WINNIPEG
      - AMERICA_RESOLUTE
      - AMERICA_REGINA
      - AMERICA_EDMONTON
      - AMERICA_CRESTON
      - AMERICA_VANCOUVER
    AccountModel:
      properties:
        id:
          type: integer
          title: Id
        tenant_id:
          type: integer
          title: Tenant Id
        organization_id:
          type: integer
          title: Organization Id
        name:
          type: string
          title: Name
        country_code:
          $ref: '#/components/schemas/CountryCode'
        timezone:
          $ref: '#/components/schemas/Timezone'
        currency:
          $ref: '#/components/schemas/Currency'
        type:
          $ref: '#/components/schemas/AccountType'
        website_domain:
          type: string
          title: Website Domain
        brand_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Brand Id
        vertical_id:
          anyOf:
          - $ref: '#/components/schemas/AccountVertical'
          - type: 'null'
        dart_billing_account:
          anyOf:
          - $ref: '#/components/schemas/DartBillingAccount'
          - type: 'null'
        updated_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated Date
        created_date:
          type: string
          format: date-time
          title: Created Date
      type: object
      required:
      - id
      - tenant_id
      - organization_id
      - name
      - country_code
      - timezone
      - currency
      - type
      - website_domain
      - brand_id
      - created_date
      title: AccountModel
    DartBillingAccount:
