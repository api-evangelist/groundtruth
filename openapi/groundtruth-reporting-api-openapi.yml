        in: query
        required: true
        schema:
          type: integer
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplySystemDistributionCampaignModel'
                title: Response Get Supply System Distribution Campaign Reporting Distribution Supply Campaign  Campaign Id  Get
        '400':
          content:
            application/json:
