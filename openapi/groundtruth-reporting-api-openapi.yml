        description: 1=device type, 2=operating system, 3=publisher type
      - name: all_adgroups
        in: query
        required: false
        schema:
          type: boolean
          description: When true, returns distribution grouped by ad group where applicable.
          default: false
          title: All Adgroups
        description: When true, returns distribution grouped by ad group where applicable.
