format: proprietary
rfc9457: false
media_type: application/json
envelope:
  schema: ErrorResponseModel
  shape: '{ "errors": [ ErrorModel, ... ] }'
  member:
    schema: ErrorModel
    required: [code, message, fields]
    properties:
      code: string — machine-readable constant (e.g. UNAUTHENTICATED)
      message: string — human-readable sentence
      fields: array of string, or null — which request fields caused the error
  note: >-
    The envelope is an ARRAY of errors, so a single response can carry several. It is not
    application/problem+json and carries no `type` URI, `title`, `status` or `instance` member,
    so RFC 9457 tooling will not parse it.
validation_envelope:
  schema: HTTPValidationError
  shape: '{ "detail": [ { "loc": [...], "msg": "...", "type": "..." } ] }'
  note: >-
    FastAPI's native validation shape. It coexists with ErrorResponseModel, so a client must be
    prepared for TWO different error bodies from the same API.
