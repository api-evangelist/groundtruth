reference_data:
  note: >-
    Eight unauthenticated /static/* lookups supply the controlled vocabularies the write model
    references — DMAs, IAB categories, publisher categories, account verticals, podcast topics,
    audio streaming genres, streaming-video content categories and premium CTV categories.
reporting_layer:
  grain: [campaign, adgroup, creative, order]
  dimensions: [day-of-week, time-of-day, product, targeting tactic, audience, location, supply/system distribution]
  note: >-
    160 of 259 operations are reporting reads. They do not create entities; they project metrics over
    the hierarchy above, keyed by campaign_id / adgroup_id / creative_id and bounded by
    start_date / end_date.
